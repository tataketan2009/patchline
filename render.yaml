# Render.com deployment config for PATCHLINE
# Two services, both served from this repo:
#   1. patchline       — static frontend site
#   2. patchline-api   — the entire backend, 100% Python (FastAPI + SQLite)
# Docs: https://render.com/docs/deploy-static-site
services:
  - type: web
    name: patchline
    runtime: static
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Single-page app: serve index.html for any path
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: patchline-api
    runtime: python
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
